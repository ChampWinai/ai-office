<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Office</title>
<style>
:root{--bg1:#060b16;--bg2:#0b1426;--card:rgba(12,24,42,.82);--line:rgba(34,211,238,.18);--neon:#22d3ee;--violet:#a78bfa;
--txt:#d9ecf5;--dim:#6b8497;--bad:#f87171;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--txt);font:13px/1.5 "Segoe UI","Leelawadee UI",Tahoma,system-ui,sans-serif;
 background:radial-gradient(1100px 560px at 8% -12%,#1d3f7a40,transparent),radial-gradient(900px 500px at 105% 8%,#4c1d9550,transparent),linear-gradient(180deg,var(--bg2),var(--bg1));
 display:flex;flex-direction:column;height:100vh;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(6px)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon);font-weight:700;margin-bottom:6px}
.mono,code,pre{font-family:Consolas,"Cascadia Mono",monospace}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 10px 0;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--neon),var(--violet));box-shadow:0 0 18px #22d3ee66;display:grid;place-items:center;color:#06121f;font-weight:900;font-size:12px}
h1{margin:0;font-size:19px;letter-spacing:.06em;background:linear-gradient(90deg,#e0f7ff,var(--neon),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{font-size:11px;color:var(--dim);margin-left:6px}
#flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#flow span{font-size:11px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);transition:.25s}
#flow span.on{background:linear-gradient(90deg,var(--neon),var(--violet));color:#06121f;border-color:transparent;box-shadow:0 0 14px #22d3ee55;font-weight:700}
#flow span.ok{color:var(--ok);border-color:#4ade8055}
#flow em{font-style:normal;color:#34506a}
#clock{font-family:Consolas,monospace;color:var(--neon);font-size:14px}
/* banners */
.banner{margin:10px 10px 0;padding:10px 14px;display:none;align-items:center;gap:12px;flex-wrap:wrap;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.banner.show{display:flex}
.banner.warn{border-color:#fbbf2466;background:linear-gradient(90deg,#fbbf2414,var(--card))}
.banner.info{border-color:#4ade8066;background:linear-gradient(90deg,#4ade8014,var(--card))}
.banner .bt{flex:1;min-width:200px}
.bar{height:6px;border-radius:6px;background:#0a1a2b;overflow:hidden;width:100%;margin-top:6px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--violet));transition:width .3s}
/* buttons */
.btn{border:0;border-radius:10px;padding:8px 14px;font:700 12px "Segoe UI",sans-serif;cursor:pointer;color:#06121f;background:linear-gradient(90deg,var(--neon),var(--violet));box-shadow:0 4px 14px #22d3ee33;transition:transform .08s,filter .2s,opacity .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--neon);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(90deg,#f87171,#fb923c);box-shadow:0 4px 14px #f8717133}
.btn.sm{padding:5px 11px;font-size:11px}
/* workspace bar */
#wsbar{display:flex;align-items:center;gap:10px;margin:10px 10px 0;padding:8px 14px}
#wsbar .lbl{margin:0}
#wspath{flex:1;min-width:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace;font-size:12px}
#wspath.set{color:var(--ok)}
/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr);gap:10px;padding:10px}
#team{overflow-y:auto;padding-right:2px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.panel{padding:14px}
/* team */
.mem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1b3350}
.mem:last-child{border-bottom:0}
.av{width:26px;height:26px;border-radius:9px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.mem .n{flex:1;font-weight:700;font-size:13px}
.st{font-size:10px;color:var(--dim);letter-spacing:.06em}
.mem.on .st{color:var(--c)}
.mem.done .st{color:var(--ok)}
.msel{flex-basis:100%;display:grid;gap:4px;padding:2px 0 0 34px}
.msel label{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.msel select{width:100%;min-width:0;font:11px Consolas,monospace;padding:3px 6px;background:#040b16;color:var(--txt);border:1px solid var(--line);border-radius:7px}
.msel select:focus{outline:1px solid var(--neon)}
.met div{display:flex;justify-content:space-between;padding:2px 0}
.met b{color:var(--neon)}
#steps{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:6px}
#steps i{flex:1;min-width:6px;border-radius:4px 4px 0 0;background:var(--c);opacity:.9}
#hist{overflow:auto;flex:1;min-height:0}
#hist div{font-size:11px;padding:4px 0;border-bottom:1px dashed #1b335044;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* departments */
.room{flex:1 1 0;min-height:0;display:flex;flex-direction:column;padding:10px 12px;transition:box-shadow .3s,border-color .3s}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#1e3350}
.room.on{border-color:var(--c);box-shadow:0 0 22px -6px var(--c),0 10px 30px rgba(0,0,0,.35)}
.room.on .dot{background:var(--c);box-shadow:0 0 10px var(--c);animation:pulse 1s infinite}
.room.done .dot{background:var(--ok)}
@keyframes pulse{50%{opacity:.3}}
.scene{flex:1;min-height:0;display:flex;gap:10px;align-items:stretch}
canvas{image-rendering:pixelated;width:44%;height:100%;min-height:0;background:#050b14;border:1px solid #1e3350;border-radius:10px;flex:none}
.mon{flex:1;min-width:0;background:#030914;border:1px solid #1e3350;border-radius:10px;position:relative;overflow:hidden;padding:8px 10px;color:var(--c);font:11px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.mon .t{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 14px);overflow:hidden}
.mon .idle{color:var(--dim);font-family:"Segoe UI",sans-serif}
/* log */
#logbox{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px}
#log{flex:1;overflow:auto;padding-right:6px}
.msg{border-left:3px solid var(--c);background:linear-gradient(90deg,#0f2440,#0c1b30);border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.msg b{display:inline-block;padding:0 8px;border-radius:999px;background:var(--c);color:#06121f;margin-right:6px;font-size:11px}
.msg.err{--c:var(--bad);background:#2a1119}
.tag{margin-left:6px;font-size:12px}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.sep{text-align:center;color:var(--dim);margin:10px 0;font-size:12px}
.sep:before,.sep:after{content:"";display:inline-block;width:14%;height:1px;background:#1e3350;vertical-align:middle;margin:0 8px}
pre{position:relative;background:#030914;padding:10px 12px;margin:8px 0;overflow-x:auto;border:1px solid #1e3350;border-radius:10px;font-size:12px}
pre button{position:absolute;top:6px;right:6px;font:600 11px "Segoe UI";cursor:pointer;background:#0b1a2e;color:var(--neon);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.add{color:#7ee7a4}.del{color:#fb8f8f}
.apv{display:flex;gap:8px;margin:6px 0 10px}
.apv button{border:0;border-radius:9px;padding:6px 14px;font:700 12px "Segoe UI";cursor:pointer;color:#06121f;background:linear-gradient(90deg,var(--neon),var(--violet))}
.apv button[data-ok="0"]{background:linear-gradient(90deg,#f87171,#fb923c)}
.apv button:disabled{opacity:.4;cursor:default}
/* input row */
form{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
form input[type=text],#task{flex:1;min-width:0;padding:10px 12px;font:13px "Segoe UI",sans-serif;background:#040b16;color:var(--txt);border:1px solid var(--line);border-radius:10px}
#task:focus{outline:1px solid var(--neon)}
.ap{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:5px;cursor:pointer}
#appr{margin:0;accent-color:var(--neon)}
#go{padding:10px 18px}
#stop{padding:10px 14px;background:linear-gradient(90deg,#f87171,#fb923c);color:#06121f;border:0;border-radius:10px;font:700 12px "Segoe UI";cursor:pointer}
#stop:disabled{opacity:.4;cursor:not-allowed}
/* footer */
footer{display:flex;gap:18px;align-items:center;padding:8px 16px;margin:0 10px 10px;font-size:12px;flex-wrap:wrap}
footer span{color:var(--dim)}footer b{color:var(--neon)}
.seg{display:inline-flex;gap:4px;vertical-align:middle}
.seg i{width:18px;height:6px;border-radius:3px;background:#1b3350}.seg i.f{background:linear-gradient(90deg,var(--neon),var(--violet));box-shadow:0 0 8px #22d3ee88}
#team.api .msel{display:none}
#provBtn{display:flex;align-items:center;gap:6px;max-width:260px}
#provLbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
dialog{background:#0c1828;color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(2,6,14,.6)}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld label{font-size:11px;color:var(--dim)}
.fld input,.fld select{width:100%;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#040b16;color:var(--txt);font:13px "Segoe UI",sans-serif}
.fld input:focus,.fld select:focus{outline:1px solid var(--neon)}
@media(max-width:900px){
 body{height:auto;overflow:auto}main{grid-template-columns:1fr}
 .room{min-height:180px}#logbox{min-height:440px}#team{display:none}}
@media(max-width:600px){form{flex-wrap:wrap}#task{flex-basis:100%}h1{font-size:16px}form button{flex:1}}
</style></head><body>

<header class="card top">
 <div class="brand"><div class="logo">AI</div><div><h1>AI OFFICE</h1><span class="ver" id="ver"></span></div></div>
 <div id="flow"></div>
 <div style="display:flex;align-items:center;gap:12px">
  <button class="btn ghost sm" id="provBtn" title="ตั้งค่า AI">⚙ <span id="provLbl">Ollama (ในเครื่อง)</span></button>
  <span id="clock">--:--:--</span>
 </div>
</header>

<dialog id="prov">
 <div class="lbl">ตั้งค่า AI</div>
 <div class="fld"><label>ตัวเลือกเร็ว (กรอกให้อัตโนมัติ)</label>
  <select id="pPreset">
   <option value="">— เลือกผู้ให้บริการ —</option>
   <option value="groq">Groq (เร็ว, ฟรี ไม่ต้องใส่บัตร)</option>
   <option value="gemini">Google Gemini (โควตาฟรีน้อย)</option>
   <option value="openrouter">OpenRouter (โมเดลฟรีที่ลงท้าย :free)</option>
  </select></div>
 <div class="fld"><label>ประเภท</label>
  <select id="pType">
   <option value="ollama">Ollama (ในเครื่อง, ค่าเริ่มต้น)</option>
   <option value="anthropic">Anthropic-compatible (แบบ ANTHROPIC_BASE_URL + Auth Token)</option>
   <option value="openai">OpenAI-compatible (OpenAI, DeepSeek, Groq, OpenRouter, LM Studio ฯลฯ)</option>
  </select></div>
 <div class="fld" id="pUrlF"><label>Base URL</label><input id="pUrl" placeholder="https://example.com/llm"></div>
 <div class="fld" id="pKeyF"><label>API key / Auth token</label><input id="pKey" type="password" autocomplete="off"></div>
 <div class="fld" id="pModelF"><label>ชื่อโมเดล (ใช้กับทุกตำแหน่ง)</label><input id="pModel" list="pModels" placeholder="เช่น Qwen3-Next"><datalist id="pModels"></datalist></div>
 <div id="pHint" style="font-size:11px;color:var(--dim);margin:-4px 0 10px"></div>
 <div id="pMsg" class="mono" style="min-height:18px;font-size:12px;margin:2px 0 12px;white-space:pre-wrap;word-break:break-word"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
  <button class="btn ghost sm" id="pTest">ทดสอบ</button>
  <button class="btn ghost sm" id="pCancel">ปิด</button>
  <button class="btn sm" id="pSave">บันทึก</button>
 </div>
</dialog>

<div class="banner info" id="updBox"><span class="bt" id="updMsg"></span><button class="btn sm" id="updBtn" hidden>อัปเดตทันที</button></div>
<div class="banner warn" id="setupBanner"><div class="bt"><span id="setupMsg"></span><div class="bar" id="setupBar"><i id="setupFill"></i></div></div><button class="btn sm" id="setupBtn">ตั้งค่าอัตโนมัติ</button></div>

<div class="card" id="wsbar"><span class="lbl">📁 โฟลเดอร์งาน</span><span id="wspath">ยังไม่ได้เลือก (โค้ดแสดงอย่างเดียว ไม่เขียนไฟล์)</span><button class="btn ghost sm" id="wsbtn">เลือกโฟลเดอร์</button></div>

<main>
 <div class="col" id="team">
  <section class="card panel"><div class="lbl">ทีมงาน</div><div id="mem"></div></section>
  <section class="card panel met"><div class="lbl">สถิติ</div>
   <div><span>งานทั้งหมด</span><b id="m-run">0</b></div>
   <div><span>ผ่าน</span><b id="m-pass">0</b></div>
   <div><span>ตีกลับ</span><b id="m-fail">0</b></div>
   <div><span>โค้ดที่รัน</span><b id="m-code">0</b></div>
   <div class="lbl" style="margin-top:8px;font-size:10px">เวลาแต่ละขั้น</div><div id="steps"></div></section>
  <section class="card panel" style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="lbl">ประวัติ</div><div id="hist"></div></section>
 </div>
 <div class="col" id="rooms"></div>
 <div class="col"><section class="card" id="logbox"><div class="lbl">บันทึกกิจกรรม</div><div id="log"></div>
  <form><input id="task" placeholder="สั่งงานหัวหน้า เช่น สร้างไฟล์ prime.py มีฟังก์ชัน is_prime(n)" required>
   <label class="ap"><input type="checkbox" id="appr">ยืนยันก่อนเขียนไฟล์</label>
   <button class="btn" id="go">RUN</button><button id="stop" type="button" disabled>หยุด</button></form>
 </section></div>
</main>

<footer class="card">
 <span>SYSTEM <b id="sys">READY</b></span>
 <span>AI AGENTS <b id="ag">0/0</b></span>
 <span>ROUND <span class="seg" id="seg"><i></i><i></i><i></i></span></span>
 <span>เวลา <b id="el">0s</b></span>
</footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const safe=(f,d)=>{try{return f()}catch{return d}};
const STAGES=[["brief","สเปก"],["plan","วิเคราะห์"],["build","ลงมือ"],["review","ตรวจ"],["report","สรุป"]];
let CFG={roles:{},models:[],version:""},ROLES=[],S={};
let M={run:0,pass:0,fail:0,code:0},cur,curText="",t0=0,timer,stepT=0,steps=[],taskTxt="";
const col=r=>CFG.roles[r].color;

/* ---------- stream helper (NDJSON) ---------- */
async function readStream(r,fn){
 const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
 for(;;){const {done,value}=await rd.read();if(done)break;
  buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
  lines.filter(Boolean).forEach(l=>fn(JSON.parse(l)))}
 if(buf.trim())fn(JSON.parse(buf));
}

/* ---------- pixel art ---------- */
function px(c,x,y,w,h,f){c.fillStyle=f;c.fillRect(x,y,w,h)}
function draw(r,t){
 const s=S[r],c=s.ctx,k=CFG.roles[r].color,hair=CFG.roles[r].hair,fr=Math.floor(t/160)%2,sk="#ffcc99";
 px(c,0,0,96,64,"#0f1a2e");
 for(let x=0;x<96;x+=8)px(c,x,0,1,38,"#14233b");
 px(c,8,6,16,14,"#1b3a63");px(c,9,7,14,12,"#2b6cb0");px(c,15,7,2,12,"#0f1a2e");px(c,9,12,14,2,"#0f1a2e");
 for(let y=40;y<64;y+=8)for(let x=0;x<96;x+=8)px(c,x,y,8,8,((x+y)/8)%2?"#27304d":"#2e3858");
 px(c,30,34,60,4,"#a0662f");px(c,30,38,60,2,"#6b4219");px(c,32,40,3,10,"#6b4219");px(c,85,40,3,10,"#6b4219");
 const g=s.on?k:"#2a3b4d";
 px(c,58,14,28,19,"#0a0f18");px(c,60,16,24,15,"#02080f");px(c,69,33,6,2,"#3a566a");
 for(let i=0;i<5;i++){const w=s.on?4+((i*7+Math.floor(t/120))%14):6;px(c,62,18+i*3,w,1,g)}
 if(s.on)px(c,60,16,24,15,k+"22");
 px(c,43,13,10,9,sk);px(c,43,11,10,4,hair);px(c,45,17,2,2,"#000");px(c,49,17,2,2,"#000");
 px(c,41,22,14,13,k);px(c,40,35,16,3,"#333");px(c,43,38,4,10,"#333");px(c,50,38,4,10,"#333");
 const dy=s.on?fr*2:0;
 if(s.wave>0&&fr){px(c,55,10,3,12,sk);px(c,55,22,3,3,k)}else px(c,55,31+dy,5,4,sk);
 px(c,38,31+(s.on?2-dy:0),5,4,sk);
 if(s.done&&!s.on){px(c,76,4,2,2,"#4ade80");px(c,78,6,2,2,"#4ade80");px(c,80,4,2,2,"#4ade80");px(c,82,2,2,2,"#4ade80")}
 px(c,10,46,8,6,"#8b4a2b");px(c,9,38,4,8,"#2f9e44");px(c,13,36,4,10,"#37b24d");px(c,17,40,4,6,"#2f9e44");
 const wag=Math.floor(t/300)%2;px(c,70,54,10,5,"#e08a3c");px(c,78,50,5,5,"#e08a3c");px(c,78,49,1,2,"#e08a3c");px(c,82,49,1,2,"#e08a3c");px(c,66,53-wag,4,2,"#e08a3c");
}
let last=0;(function loop(t){if(t-last>90){last=t;ROLES.forEach(r=>{if(S[r].wave>0&&t%1000<90)S[r].wave--;draw(r,t)})}requestAnimationFrame(loop)})(0);

/* ---------- build the office from /config ---------- */
function buildOffice(){
 ROLES=Object.keys(CFG.roles);
 $("mem").innerHTML=ROLES.map(r=>{const c=CFG.roles[r];return `<div class="mem" id="mem-${r}" style="--c:${c.color}"><i class="av"></i><span class="n">${esc(c.th)}</span><span class="st">[IDLE]</span><div class="msel"><label>ปกติ<select data-role="${r}" data-kind="model"></select></label><label>ยาก<select data-role="${r}" data-kind="hard_model"></select></label></div></div>`}).join("");
 $("rooms").innerHTML=ROLES.map(r=>{const c=CFG.roles[r];return `<section class="card room" id="${r}" style="--c:${c.color}"><div class="rh"><span class="lbl" style="margin:0">${esc(c.room)}</span><i class="dot"></i></div><div class="scene"><canvas width="96" height="64"></canvas><div class="mon"><div class="t idle">รอรับงาน…</div></div></div></section>`}).join("");
 ROLES.forEach(r=>S[r]={on:false,done:false,wave:0,ctx:$(r).querySelector("canvas").getContext("2d")});
 $("flow").innerHTML=STAGES.map(([k,t],i)=>`${i?"<em>›</em>":""}<span>${t}</span>`).join("");
 $("ag").textContent="0/"+ROLES.length;
 fillModels();
 applyProvider();
}
function providerName(p){
 const u=p.base_url||"";
 if(p.type==="anthropic")return "Anthropic";
 if(/googleapis/.test(u))return "Gemini";
 if(/groq/.test(u))return "Groq";
 if(/openrouter/.test(u))return "OpenRouter";
 return "OpenAI-compatible";
}
function applyProvider(){
 const p=CFG.provider||{type:"ollama"},api=p.type!=="ollama";
 $("team").classList.toggle("api",api);
 $("provLbl").textContent=api?`${providerName(p)} · ${p.model}`:"Ollama (ในเครื่อง)";
}
function errHint(){
 const p=CFG.provider||{type:"ollama"};
 return p.type!=="ollama"
  ? `${providerName(p)}: ตรวจ API key, Base URL, ชื่อโมเดล และโควตา (⚙ AI) ถ้าขึ้น 503/429 คือผู้ให้บริการยุ่งหรือโควตาเต็ม ลองใหม่ภายหลัง`
  : 'ตรวจว่า Ollama รันอยู่ และชื่อโมเดลถูกต้อง (กด "ตั้งค่าอัตโนมัติ" ด้านบนได้)';
}
function fillModels(){
 document.querySelectorAll("#mem select").forEach(sel=>{
  const role=sel.dataset.role,kind=sel.dataset.kind,cur=CFG.roles[role][kind]||"";
  const list=[...new Set([cur,...CFG.models].filter(Boolean))];
  sel.innerHTML=list.map(m=>`<option${m===cur?" selected":""}>${esc(m)}</option>`).join("");
  sel.onchange=async()=>{const r=await fetch("/models",{method:"POST",body:JSON.stringify({role,kind,name:sel.value})});
   if(r.ok)CFG.roles[role][kind]=sel.value;else alert("บันทึกโมเดลไม่สำเร็จ")};
 });
}

/* ---------- state helpers ---------- */
const setM=()=>Object.keys(M).forEach(k=>$("m-"+k).textContent=M[k]);
function setSt(r,s){
 const d=$(r),m=$("mem-"+r);S[r].on=s=="on";S[r].done=s=="done";
 d.classList.toggle("on",s=="on");d.classList.toggle("done",s=="done");
 m.classList.toggle("on",s=="on");m.classList.toggle("done",s=="done");
 m.querySelector(".st").textContent=s=="on"?"[WORKING]":s=="done"?"[DONE]":"[IDLE]";
 $("ag").textContent=ROLES.filter(x=>S[x].on).length+"/"+ROLES.length;
}
function stage(i){document.querySelectorAll("#flow span").forEach((s,j)=>s.className=j<i?"ok":j==i?"on":"")}
function render(el,text){
 el.innerHTML=text.split("```").map((p,i)=>{
  if(i%2==0) return esc(p);
  return `<pre><button>COPY</button><code>${esc(p.replace(/^[^\n]*\n/,""))}</code></pre>`}).join("");
 el.querySelectorAll("pre button").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.nextSibling.textContent);b.textContent="OK";setTimeout(()=>b.textContent="COPY",900)});
}
function diffHtml(d){
 return `<pre>${d.split("\n").map(l=>`<span class="${l.startsWith("+")&&!l.startsWith("+++")?"add":l.startsWith("-")&&!l.startsWith("---")?"del":""}">${esc(l)}</span>`).join("\n")}</pre>`;
}
const hist=()=>safe(()=>JSON.parse(localStorage.hist||"[]"),[]);
function showHist(){$("hist").innerHTML=hist().map(h=>`<div class="${h.ok?"pass":"fail"}">${h.ok?"✔":"✘"} ${h.s}s · ${esc(h.t)}</div>`).join("")||'<div style="color:var(--dim)">ยังไม่มีงาน</div>'}
function showSteps(){const mx=Math.max(...steps.map(s=>s.d),1);$("steps").innerHTML=steps.map(s=>`<i title="${esc(s.r)} ${s.d.toFixed(0)}s" style="--c:${col(s.r)};height:${Math.max(10,s.d/mx*100)}%"></i>`).join("")}
function newMsg(role){
 const d=document.createElement("div");d.className="msg";d.style.setProperty("--c",col(role));
 d.innerHTML=`<b>${esc(CFG.roles[role].th)}</b><span class="tag"></span><div class="t"></div>`;$("log").append(d);cur=d;curText="";
}

/* ---------- job events ---------- */
function handle(e){
 const log=$("log");
 if(e.error){log.insertAdjacentHTML("beforeend",`<div class="msg err"><span class="fail">⚠ ${esc(e.error)}</span><br><small>${esc(errHint())}</small></div>`);$("sys").textContent="ERROR";return}
 if(e.approve){
  const d=document.createElement("div");d.className="apv";
  d.innerHTML='<button data-ok="1">อนุมัติเขียนไฟล์</button><button data-ok="0">ไม่อนุมัติ</button>';
  d.querySelectorAll("button").forEach(b=>b.onclick=()=>{d.querySelectorAll("button").forEach(x=>x.disabled=true);
   fetch("/decide",{method:"POST",body:JSON.stringify({ok:b.dataset.ok==="1"})})});
  log.append(d);log.scrollTop=log.scrollHeight;return}
 if(e.files)fetch("/workspace").then(r=>r.json()).then(showWs);
 if(e.note){
  if(/ผลรันโค้ด/.test(e.note)){M.code++;setM()}
  log.insertAdjacentHTML("beforeend",`<div class="sep">⚙ ${esc(e.note)}</div>`);
  if(e.diff)log.insertAdjacentHTML("beforeend",diffHtml(e.diff));
  return}
 if(e.round){
  $("seg").querySelectorAll("i").forEach((s,i)=>s.classList.toggle("f",i<e.round));
  log.insertAdjacentHTML("beforeend",`<div class="sep">รอบที่ ${e.round}</div>`);return}
 if("done" in e){
  const s=Math.round((Date.now()-t0)/1000),h=hist();
  h.unshift({ok:e.done,s,t:taskTxt.slice(0,40)});safe(()=>localStorage.hist=JSON.stringify(h.slice(0,8)));showHist();return}
 const mon=$(e.role).querySelector(".t");
 if(e.status=="working"){
  stepT=Date.now();stage(STAGES.findIndex(s=>s[0]==e.phase));
  setSt(e.role,"on");newMsg(e.role);mon.className="t";mon.textContent="…"}
 if(e.token){curText+=e.token;render(cur.querySelector(".t"),curText);mon.textContent=curText.slice(-260)}
 if(e.status=="done"){
  setSt(e.role,"done");steps.push({r:e.role,d:(Date.now()-stepT)/1000});showSteps();
  if(e.role=="QA"){
   const v=[...curText.matchAll(/VERDICT:\s*\**\s*(PASS|FAIL)/gi)].pop();
   const ok=v?v[1].toUpperCase()=="PASS":/^\s*PASS/i.test(curText);
   cur.querySelector(".tag").innerHTML=ok?'<span class="pass">✔ PASS</span>':'<span class="fail">✘ FAIL</span>';
   ok?M.pass++:M.fail++;setM();
   if(!ok&&S.DEV)S.DEV.wave=3}}
 log.scrollTop=log.scrollHeight;
}

/* ---------- workspace ---------- */
function showWs(j){const e=$("wspath");e.textContent=j.path?`${j.path}  (${j.files.length} ไฟล์)`:"ยังไม่ได้เลือก (โค้ดแสดงอย่างเดียว ไม่เขียนไฟล์)";e.className=j.path?"set":""}
$("wsbtn").onclick=async()=>{ // desktop app: native folder dialog; browser: ask for a path
 const p=window.pywebview?.api?await window.pywebview.api.pick_folder():prompt("พิมพ์พาธโฟลเดอร์งาน เช่น C:\\Users\\me\\myproject");
 if(!p)return;
 const r=await fetch("/workspace",{method:"POST",body:JSON.stringify({path:p})}),j=await r.json();
 if(j.error)alert(j.error);else showWs(j)};

/* ---------- environment setup ---------- */
function setupText(t){$("setupMsg").textContent=t}
async function checkSetup(){
 const s=await fetch("/setup/status").then(r=>r.json()).catch(()=>null);
 const b=$("setupBanner");
 if(!s||s.provider!=="ollama"||(s.ollama&&!s.missing.length)){b.classList.remove("show");return}
 b.classList.add("show");
 setupText(!s.ollama
  ? "ยังไม่พบ Ollama (โปรแกรมรันโมเดล AI ในเครื่อง) กดตั้งค่าอัตโนมัติเพื่อติดตั้งและดาวน์โหลดโมเดลที่ต้องใช้"
  : `ต้องดาวน์โหลดโมเดลอีก ${s.missing.length} ตัว: ${s.missing.join(", ")}`);
 $("setupBtn").disabled=false;
}
$("setupBtn").onclick=async()=>{
 $("setupBtn").disabled=true;$("setupBar").style.display="block";
 try{
  const r=await fetch("/setup",{method:"POST",body:JSON.stringify({pull_hard:false})});
  await readStream(r,e=>{
   if(e.error)throw new Error(e.error);
   if(e.step=="ollama"){if(e.state=="error")throw new Error(e.msg);setupText(e.msg)}
   if(e.step=="pull"){setupText(`ดาวน์โหลด ${e.model} ${e.pct}%`);$("setupFill").style.width=e.pct+"%"}
   if(e.step=="done")setupText("ตั้งค่าเสร็จแล้ว ✔")});
  $("setupBar").style.display="none";$("setupFill").style.width="0";
  setTimeout(checkSetup,1200);
 }catch(err){setupText("⚠ "+err.message+" — กดอีกครั้งเพื่อลองใหม่");$("setupBtn").disabled=false}
};

/* ---------- auto update ---------- */
async function checkUpdate(){
 const u=await fetch("/update").then(r=>r.json()).catch(()=>({}));
 if(!u.available)return;
 $("updBox").classList.add("show");
 $("updMsg").textContent=`มีเวอร์ชันใหม่ v${u.latest} (ตอนนี้ v${u.current})`+(u.frozen?"":" — รันจากซอร์ส ให้ใช้ git pull แทน");
 $("updBtn").hidden=!u.frozen;
}
$("updBtn").onclick=async()=>{
 $("updBtn").disabled=true;let restarting=false;
 try{
  const r=await fetch("/update/install",{method:"POST",body:"{}"});
  await readStream(r,e=>{
   if(e.error)throw new Error(e.error);
   if(e.step=="update"){if(e.state=="restart")restarting=true;$("updMsg").textContent=e.msg}});
 }catch(err){
  if(restarting){$("updMsg").textContent="กำลังเปิดเวอร์ชันใหม่… หน้าต่างจะปิดและเปิดขึ้นมาใหม่อัตโนมัติ";return}
  $("updMsg").textContent="⚠ "+err.message;$("updBtn").disabled=false}
};

/* ---------- submit a job ---------- */
document.querySelector("form").onsubmit=async ev=>{
 ev.preventDefault();$("go").disabled=true;$("stop").disabled=false;$("log").innerHTML="";
 M.run++;setM();stage(-1);steps=[];showSteps();taskTxt=$("task").value;
 ROLES.forEach(r=>{setSt(r,"idle");const t=$(r).querySelector(".t");t.className="t idle";t.textContent="รอรับงาน…";S[r].wave=0});
 $("seg").querySelectorAll("i").forEach(s=>s.classList.remove("f"));$("sys").textContent="RUNNING";
 t0=Date.now();clearInterval(timer);timer=setInterval(()=>$("el").textContent=Math.round((Date.now()-t0)/1000)+"s",500);
 try{
  const r=await fetch("/",{method:"POST",body:JSON.stringify({task:$("task").value,approve:$("appr").checked})});
  await readStream(r,handle);
  if($("sys").textContent!="ERROR")$("sys").textContent="OPTIMAL";
 }catch(err){handle({error:err.message})}
 clearInterval(timer);stage(5);ROLES.forEach(r=>{S[r].on=false;$(r).classList.remove("on")});
 $("ag").textContent="0/"+ROLES.length;$("go").disabled=false;$("stop").disabled=true;
};
$("stop").onclick=()=>fetch("/stop",{method:"POST",body:"{}"});

/* ---------- AI provider dialog ---------- */
const pType=$("pType"),pUrl=$("pUrl"),pKey=$("pKey"),pModel=$("pModel"),pMsg=$("pMsg");
const PRESETS={
 groq:{type:"openai",base_url:"https://api.groq.com/openai/v1",model:"openai/gpt-oss-120b",
  models:["openai/gpt-oss-120b","openai/gpt-oss-20b","meta-llama/llama-4-scout-17b-16e-instruct","qwen/qwen3-32b"],key:"console.groq.com/keys"},
 gemini:{type:"openai",base_url:"https://generativelanguage.googleapis.com/v1beta/openai",model:"gemini-flash-latest",
  models:["gemini-flash-latest","gemini-2.5-flash","gemini-2.5-flash-lite"],key:"aistudio.google.com/apikey"},
 openrouter:{type:"openai",base_url:"https://openrouter.ai/api/v1",model:"google/gemma-4-31b-it:free",
  models:["google/gemma-4-31b-it:free","nvidia/nemotron-3-super-120b-a12b:free","poolside/laguna-s-2.1:free"],key:"openrouter.ai/keys"}
};
$("pPreset").onchange=()=>{
 const k=$("pPreset").value;if(!k)return;const P=PRESETS[k];
 pType.value=P.type;pUrl.value=P.base_url;pModel.value=P.model;
 $("pModels").innerHTML=P.models.map(m=>`<option value="${esc(m)}">`).join("");
 $("pHint").textContent="ขอ API key ได้ที่ "+P.key+" แล้ววางในช่องด้านล่าง";
 toggleProv()};
function toggleProv(){const api=pType.value!=="ollama";["pUrlF","pKeyF","pModelF"].forEach(id=>$(id).style.display=api?"grid":"none")}
pType.onchange=toggleProv;
$("provBtn").onclick=()=>{
 const p=CFG.provider||{type:"ollama"};
 pType.value=p.type;pUrl.value=p.base_url||"";pModel.value=p.model||"";pKey.value="";
 $("pPreset").value="";$("pHint").textContent="";
 pKey.placeholder=p.has_key?"บันทึกไว้แล้ว (เว้นว่างเพื่อใช้ค่าเดิม)":"วาง API key หรือ Auth token";
 pMsg.textContent="";toggleProv();$("prov").showModal()};
const provBody=()=>({type:pType.value,base_url:pUrl.value,model:pModel.value,api_key:pKey.value});
async function provCall(path){
 const r=await fetch(path,{method:"POST",body:JSON.stringify(provBody())});
 const j=await r.json().catch(()=>({error:"ตอบกลับไม่ถูกต้อง"}));
 if(!r.ok||j.error)throw new Error(j.error||"ผิดพลาด");
 return j}
$("pTest").onclick=async()=>{pMsg.textContent="กำลังทดสอบ…";
 try{const j=await provCall("/provider/test");pMsg.textContent="✔ ตอบกลับ: "+j.reply}catch(err){pMsg.textContent="⚠ "+err.message}};
$("pSave").onclick=async()=>{
 try{await provCall("/provider");
  CFG=await fetch("/config").then(r=>r.json());applyProvider();checkSetup();
  pMsg.textContent="บันทึกแล้ว ✔";setTimeout(()=>$("prov").close(),500)
 }catch(err){pMsg.textContent="⚠ "+err.message}};
$("pCancel").onclick=()=>$("prov").close();

/* ---------- start ---------- */
(async function init(){
 CFG=await fetch("/config").then(r=>r.json());
 $("ver").textContent="v"+CFG.version;
 buildOffice();
 showHist();
 setInterval(()=>$("clock").textContent=new Date().toTimeString().slice(0,8),1000);
 fetch("/workspace").then(r=>r.json()).then(showWs).catch(()=>{});
 checkSetup();
 checkUpdate();
})();
</script></body></html>
